name: Paquets Debian et Arch Linux

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Décider de la publication
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.decision.outputs.tag }}
      release: ${{ steps.decision.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - name: Comparer la version applicative aux tags publiés
        id: decision
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' pyproject.toml | head -n 1)
          test -n "$version"
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # Tag poussé à la main : il doit correspondre à la version.
            test "$GITHUB_REF_NAME" = "$tag"
            release=true
          elif [ "$GITHUB_EVENT_NAME" = push ] && ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            # Merge sur main d'une version encore jamais publiée.
            release=true
          else
            release=false
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Version $version, tag $tag, publication : $release" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Construire et vérifier Debian 12 et Arch Linux
    needs: version
    if: needs.version.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Bibliothèques graphiques et outils Debian
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev xvfb xauth libglib2.0-0 libgl1 fontconfig libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-shape0
      - run: uv sync --locked --extra test --extra build
      - run: uv run --no-sync python -m pytest -q --junitxml=test-results.xml
      - name: Résumer les échecs dans les annotations
        if: failure()
        run: python scripts/report_ci_failures.py test-results.xml
      - name: Bundle portable et paquet Debian
        run: uv run --no-sync python scripts/build_release.py
      - name: Vérifier aussi le démarrage graphique X11
        run: xvfb-run -a env QT_QPA_PLATFORM=xcb dist/MusicScope/MusicScope --self-test
      - name: Mise à jour reconnue pour l'archive portable
        run: |
          { dist/MusicScope/MusicScope --check-update || true; } | tee check.txt
          grep -q "Installation : portable" check.txt
      - name: Construire le paquet Arch avec makepkg non-root
        run: |
          docker run --rm -v "$PWD/build/arch:/build" -w /build archlinux:base-devel bash -euc '
            useradd -m packager
            chown -R packager:packager /build
            runuser -u packager -- makepkg --noconfirm --nodeps
          '
          cp build/arch/*.pkg.tar.zst release/
      - name: Installer, tester et retirer le paquet sous Debian 12
        run: |
          docker run --rm -v "$PWD/release:/packages:ro" debian:12-slim sh -ec '
            apt-get update
            apt-get install -y --no-install-recommends /packages/musicscope_*_amd64.deb
            QT_QPA_PLATFORM=offscreen musicscope --self-test
            { musicscope --check-update || true; } | grep -q "Installation : deb"
            dpkg -r musicscope
            test ! -e /opt/musicscope
          '
      - name: Installer, tester et retirer le paquet sous Arch Linux
        run: |
          docker run --rm -v "$PWD/release:/packages:ro" archlinux:base bash -euc '
            pacman -Syu --noconfirm
            pacman -S --noconfirm --needed libglvnd libx11 libxkbcommon libxkbcommon-x11 fontconfig freetype2 dbus glib2 libxcb xcb-util-cursor xcb-util-wm xcb-util-keysyms xcb-util-image xcb-util-renderutil zlib xorg-server-xvfb xorg-xauth
            pacman -U --noconfirm /packages/musicscope-*.pkg.tar.zst
            QT_QPA_PLATFORM=offscreen musicscope --self-test
            xvfb-run -a env QT_QPA_PLATFORM=xcb musicscope --self-test
            { musicscope --check-update || true; } | grep -q "Installation : arch"
            pacman -R --noconfirm musicscope
            test ! -e /opt/musicscope
          '
      - run: python scripts/build_release.py --checksums-only release
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-linux
          path: |
            release/*.tar.gz
            release/*.deb
            release/*.pkg.tar.zst
            release/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publier les paquets Linux validés
    if: needs.version.outputs.release == 'true'
    needs: [version, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binaries-linux
          path: release
      - name: Créer ou actualiser la version GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.tar.gz release/*.deb release/*.pkg.tar.zst release/SHA256SUMS --clobber
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release create "$TAG" release/*.tar.gz release/*.deb release/*.pkg.tar.zst release/SHA256SUMS --verify-tag --title "MusicScope $TAG — Debian et Arch Linux" --notes-file docs/distribution.md
          else
            # Le tag est créé sur le commit exact qui vient d'être construit et testé.
            gh release create "$TAG" release/*.tar.gz release/*.deb release/*.pkg.tar.zst release/SHA256SUMS --target "$GITHUB_SHA" --title "MusicScope $TAG — Debian et Arch Linux" --notes-file docs/distribution.md
          fi
      - name: Attester la provenance des paquets (Sigstore)
        # Vérifiable par chacun : gh attestation verify FICHIER -R 1002-AZ-2001/MusicScope
        uses: actions/attest@v4
        with:
          subject-checksums: release/SHA256SUMS

  image:
    name: Publier l'image du NAS sur GHCR
    # Après la version GitHub : l'image porte le même numéro que les paquets publiés.
    if: needs.version.outputs.release == 'true'
    needs: [version, publish]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Construire l'image localement
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: musicscope-nas:ci
      - name: Vérifier l'image sans réseau (démo, export, absence de Qt)
        run: |
          docker run --rm --network none --entrypoint sh musicscope-nas:ci -ec '
            python -c "from pathlib import Path; from musicscope.demo import create_demo; create_demo(Path(\"/tmp/lib\"))"
            python -m musicscope --nas-work /tmp/lib --out /tmp/out --cache /tmp/cache
            python -c "import gzip, json, importlib.util as u; assert u.find_spec(\"PySide6\") is None; d = json.load(gzip.open(\"/tmp/out/musicscope-nas.json.gz\")); assert len(d[\"tracks\"]) == 16 and d[\"hashes\"] and d[\"spectrum\"]"
          '
          test "$(docker run --rm --entrypoint id musicscope-nas:ci -u)" = 568
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Nom de l'image en minuscules
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Pousser l'image vérifiée
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ needs.version.outputs.tag }}
            ${{ steps.name.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.tag }}
            org.opencontainers.image.description=MusicScope : travail du NAS (tags, SHA-256, spectre) en lecture seule
      - name: Attester la provenance de l'image (Sigstore)
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
