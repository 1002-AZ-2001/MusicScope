[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "musicscope"
version = "0.6.0"
description = "Audit musical, diagnostic Jellyfin et rangement assisté"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7,<7", "mutagen>=1.47,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
build = ["pyinstaller>=6.16,<7"]

[project.scripts]
musicscope = "musicscope.__main__:main"

[tool.setuptools.packages.find]
include = ["musicscope*"]

[tool.setuptools.package-data]
musicscope = ["data/*.flac", "data/*.mp3", "data/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
